[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clearview-pdf"
version = "0.1.0"
description = "A small, offline, reading-first PDF viewer"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "PySide6-Essentials>=6.7,<7",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "Pillow>=10"]
semantic = ["fastembed>=0.7,<1"]
build = ["pyinstaller>=6", "Pillow>=10", "fastembed>=0.7,<1"]

[project.gui-scripts]
clearview-pdf = "clearview_pdf.app:main"

[tool.setuptools.packages.find]
include = ["clearview_pdf*"]

[tool.setuptools.package-data]
clearview_pdf = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
